<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Vocalis</title>
  <style>
    /*
      The splash is the app's first frame, so it uses the same language:
      graphite chassis, one amber signal, no gradients, no light field.
      Values are inlined rather than imported because this window loads before
      the app:// protocol handler is registered.
    */
    :root {
      --gr-950: #111214;
      --gr-900: #181A1C;
      --gr-500: #6C7178;
      --am-500: #E0872B;
      --text-primary: #F2F4F6;
      --text-tertiary: #8E949C;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-primary);
      background: var(--gr-900);
      -webkit-font-smoothing: antialiased;
      border-radius: 12px;
    }

    .wrap {
      height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    /* Segmented bars — the Meter language, used as the wordmark glyph. */
    .glyph { display: flex; align-items: center; gap: 2px; height: 22px; }
    .glyph span {
      width: 3px; border-radius: 1px; display: block;
      background: var(--am-500);
      animation: eq 1.05s ease-in-out infinite;
    }
    .glyph span:nth-child(1) { height: 36%; animation-delay: 0s; }
    .glyph span:nth-child(2) { height: 68%; animation-delay: .11s; }
    .glyph span:nth-child(3) { height: 100%; animation-delay: .22s; }
    .glyph span:nth-child(4) { height: 54%; animation-delay: .33s; }
    .glyph span:nth-child(5) { height: 80%; animation-delay: .44s; }
    @keyframes eq { 0%, 100% { transform: scaleY(.42); } 50% { transform: scaleY(1); } }

    .logo { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; }

    /* MeterBar, indeterminate — 4px track, amber fill, linear travel. */
    .bar {
      width: 176px; height: 4px;
      background: rgba(108, 113, 120, 0.2);
      border-radius: 2px; overflow: hidden;
    }
    .bar::after {
      content: ""; display: block; height: 100%; width: 32%;
      border-radius: 2px;
      background: var(--am-500);
      animation: slide 1.15s cubic-bezier(0.32, 0.72, 0, 1) infinite;
    }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(420%); } }

    .sub { color: var(--text-tertiary); font-size: 11px; line-height: 15px; }

    @media (prefers-reduced-motion: reduce) {
      .glyph span { animation: none; }
      .bar::after { animation: none; width: 100%; opacity: 0.45; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="glyph"><span></span><span></span><span></span><span></span><span></span></div>
      <div class="logo">Vocalis</div>
    </div>
    <div class="bar"></div>
    <div class="sub">Starting the local engine…</div>
  </div>
</body>
</html>
